name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (Swift 6.2+ needed for default MainActor isolation)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Use example town sources
        run: cp TownHallLive/Resources/TownSources.example.plist TownHallLive/Resources/TownSources.plist

      - name: Generate project
        run: xcodegen

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -scheme TownHallLive \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Check compiled localizations
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "TownHallLive.app" -path "*iphonesimulator*" | head -1)
          echo "App: $APP"
          for lang in en zh-Hans es hi ar; do
            test -f "$APP/$lang.lproj/Localizable.strings" || { echo "missing $lang.lproj/Localizable.strings"; ls "$APP"; exit 1; }
          done
          plutil -p "$APP/ar.lproj/Localizable.strings" | grep -m 3 "Settings\|Warrants\|History"
          plutil -p "$APP/es.lproj/Localizable.strings" | grep "Shown in the original English" || { echo "content-localization strings missing"; exit 1; }
