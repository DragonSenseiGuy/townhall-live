name: TownHallLive
options:
  bundleIdPrefix: com.townhalllive
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # UI strings are looked up by key at runtime (L()), so the catalog's keys
    # are maintained by hand instead of extracted from source.
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  TownHallLive:
    type: application
    platform: iOS
    sources:
      - path: TownHallLive
        excludes:
          - "Resources/**"
      - path: TownHallLive/Resources
        buildPhase: resources
    info:
      path: TownHallLive/Info.plist
      properties:
        CFBundleDisplayName: TownHall Live
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
          - es
          - hi
          - ar
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
